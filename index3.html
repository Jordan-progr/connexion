<body>

    <p>Vous n'avez pas de compte?<a href="index2.html">S'inscrire</a></p>

<div class="overlay cache" id="overlay">
  <div class="plaque">
    <h2>Mot de Passe Oublié ?</h2>
    <p>Entrez l'adresse email associée à votre compte.</p>
    <input type="email" placeholder="Entrez votre mail">
    <input type="text" placeholder="Entrez le code de vérification">
    <button>Continuer</button>
   </div>
    <script>
        const oublier = document.getElementById("oublier");
        const overlay = document.getElementById("overlay");
      
        oublier.addEventListener("click", function(a){
            a.preventDefault();
            overlay.classList.remove("cache");
         });
         overlay.addEventListener("click",function(a){
            if(a.target == overlay){
                overlay.classList.add("cache");
            }
         });
    </script>
</div>

</body>
